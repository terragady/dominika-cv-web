<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- This page is a private convenience shortcut, not a public profile.
         noindex keeps it out of search results; no-referrer stops the URL
         leaking to any site reached from here. Note that neither applies to
         the .enc files themselves — PDFs/binaries would need an X-Robots-Tag
         HTTP header, which GitHub Pages cannot set. robots.txt is what covers
         those, and the encryption is what makes it not matter. -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <title>CV</title>
    <style>
      :root {
        --accent: #1f4e79;
        --ink: #222;
        --muted: #555;
        --rule: #d0d0d0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #f7f7f5;
        color: var(--ink);
        font: 16px/1.5 "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: 100%;
        max-width: 26rem;
        background: #fff;
        border: 1px solid var(--rule);
        border-radius: 10px;
        padding: 1.75rem;
      }
      h1 {
        margin: 0 0 1.25rem;
        font-size: 1.3rem;
        color: var(--accent);
      }
      label {
        display: block;
        font-size: 0.85rem;
        color: var(--muted);
        margin-bottom: 0.35rem;
      }
      input[type="password"] {
        width: 100%;
        padding: 0.6rem 0.7rem;
        font-size: 1rem;
        border: 1px solid var(--rule);
        border-radius: 6px;
      }
      input[type="password"]:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .row { display: flex; gap: 0.6rem; margin-top: 1rem; }
      button {
        flex: 1;
        padding: 0.65rem 0.5rem;
        font: inherit;
        font-size: 0.95rem;
        color: #fff;
        background: var(--accent);
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover:not(:disabled) { background: #17395a; }
      button:disabled { opacity: 0.5; cursor: default; }
      #status {
        margin-top: 1rem;
        min-height: 1.4em;
        font-size: 0.85rem;
        color: var(--muted);
      }
      #status[data-state="error"] { color: #a3282d; }
      footer {
        margin-top: 1.25rem;
        padding-top: 0.9rem;
        border-top: 1px solid var(--rule);
        font-size: 0.75rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Dominika Michalik — CV</h1>

      <!-- A real <form> (rather than a bare input) so browser password
           managers recognise this and offer to save the passphrase. That is
           the intended way to avoid retyping it — deliberately not localStorage,
           which would leave it readable to any script on the origin. -->
      <form id="unlock" autocomplete="on">
        <label for="passphrase">Passphrase</label>
        <input
          id="passphrase"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />
        <div class="row">
          <button type="submit" data-lang="en">English</button>
          <button type="submit" data-lang="no">Norsk</button>
        </div>
      </form>

      <p id="status" role="status" aria-live="polite"></p>

      <footer>Files are stored encrypted. The downloaded PDF is a normal, unlocked PDF.</footer>
    </main>

    <script type="module">
      // Must match ITERATIONS in scripts/encrypt-pdfs.mjs.
      const ITERATIONS = 600_000;
      const SALT_BYTES = 16;
      const IV_BYTES = 12;

      const form = document.getElementById("unlock");
      const passphraseInput = document.getElementById("passphrase");
      const statusEl = document.getElementById("status");
      const buttons = [...form.querySelectorAll("button")];

      // Cache the derived key per passphrase, so downloading the second
      // language doesn't repeat the (deliberately slow) PBKDF2 step.
      let cached = { passphrase: null, key: null };

      const setStatus = (message, state = "") => {
        statusEl.textContent = message;
        statusEl.dataset.state = state;
      };

      let manifestPromise;
      const getManifest = () => (manifestPromise ??= fetch("manifest.json").then((r) => {
        if (!r.ok) throw new Error("Could not load manifest.json");
        return r.json();
      }));

      async function deriveKey(passphrase, salt) {
        if (cached.passphrase === passphrase && cached.key) return cached.key;
        const baseKey = await crypto.subtle.importKey(
          "raw",
          new TextEncoder().encode(passphrase),
          "PBKDF2",
          false,
          ["deriveKey"],
        );
        const key = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt, iterations: ITERATIONS, hash: "SHA-256" },
          baseKey,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"],
        );
        cached = { passphrase, key };
        return key;
      }

      async function decrypt(url, passphrase) {
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) throw new Error(`Could not fetch ${url}`);
        const blob = new Uint8Array(await response.arrayBuffer());

        const salt = blob.subarray(0, SALT_BYTES);
        const iv = blob.subarray(SALT_BYTES, SALT_BYTES + IV_BYTES);
        // Ciphertext and the trailing 16-byte GCM tag stay concatenated:
        // WebCrypto expects them that way and verifies the tag on decrypt,
        // which is what makes a wrong passphrase fail loudly rather than
        // silently producing garbage.
        const payload = blob.subarray(SALT_BYTES + IV_BYTES);

        const key = await deriveKey(passphrase, salt);
        const plaintext = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, payload);
        return new Blob([plaintext], { type: "application/pdf" });
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const lang = event.submitter?.dataset.lang ?? "en";
        const passphrase = passphraseInput.value;
        if (!passphrase) return;

        buttons.forEach((b) => (b.disabled = true));
        setStatus("Decrypting…");

        try {
          const manifest = await getManifest();
          const entry = manifest.files[lang];
          if (!entry) throw new Error(`No ${lang} file published yet`);

          const pdf = await decrypt(entry.src, passphrase);

          const url = URL.createObjectURL(pdf);
          const link = document.createElement("a");
          link.href = url;
          link.download = entry.name;
          link.click();
          // Revoked on a delay: Safari aborts the download if the object URL
          // disappears in the same tick as the click.
          setTimeout(() => URL.revokeObjectURL(url), 30_000);

          setStatus(`Downloaded ${entry.name}`);
        } catch (error) {
          // An AES-GCM tag mismatch throws a bare OperationError with no
          // message, and by far the likeliest cause is a mistyped passphrase.
          const wrongPassphrase = error instanceof DOMException || !error.message;
          setStatus(
            wrongPassphrase ? "Wrong passphrase." : `Failed: ${error.message}`,
            "error",
          );
        } finally {
          buttons.forEach((b) => (b.disabled = false));
        }
      });
    </script>
  </body>
</html>
